schema_version: 1
title: Finding Z — PHYS 225A

# Any dataset, model, collider, or process can use:
#   enabled: false
#   available_from: 2026-10-15
#   available_until: 2026-11-15

features:
  # Instructor-only smoke-test/fallback. Set true to expose it temporarily;
  # normal student simulation starts with the MadGraph collider workflow.
  toy_generator: false
  prepared_data_analysis: true
  madgraph_only: true
  full_pipeline: true

datasets:
  # Add course samples as complete saved-run directories (manifest.json + stage files).
  # Example: path: /data/runs/dy-reference
  # The old CSV templates below are retained only for legacy notebooks.
  signal:
    label: Z signal template
    path: ../data/signal.csv
    provenance: Synthetic neutral-current Drell–Yan teaching signal; not collider data.
    enabled: true
  background:
    label: Smooth background template
    path: ../data/background.csv
    provenance: Synthetic smooth teaching background; not collider data.
    enabled: true
  collision:
    label: Pseudodata
    path: ../data/collision.csv
    provenance: Synthetic collision-like teaching sample; not collider data.
    enabled: true

models:
  sm:
    label: Standard Model (tree level)
    madgraph_name: sm
    enabled: true
  # A restricted hypothesis, not a separate UFO: its process cards exclude Z/H.
  qed_dilepton:
    label: QED only (dilepton processes)
    madgraph_name: sm
    enabled: true
  loop_sm:
    label: Standard Model (loop-ready UFO)
    madgraph_name: loop_sm
    # Keep installed for instructor tests; do not present it as a standard course choice.
    enabled: false
  blackbox_1:
    label: Black-box model 1
    madgraph_name: blackbox_1
    enabled: false

detectors:
  cms:
    label: CMS-like detector
    card: cards/delphes_card_CMS.tcl
    description: Delphes CMS response for the LHC proton-proton environment.
    enabled: true
  aleph:
    label: ALEPH-like detector
    card: cards/delphes_card_ALEPH.tcl
    description: Delphes ALEPH response for the LEP-like electron-positron experiment.
    enabled: true
  idea:
    label: IDEA-like detector
    card: cards/delphes_card_IDEA.tcl
    description: Delphes IDEA response for the future circular 240 GeV Higgs-factory preset.
    enabled: true

colliders:
  markii29:
    label: "MARK II-like 29 GeV e+e- run"
    beam_type: ee
    beam_energy_gev: 14.5
    full_pipeline: false
    mass_window_gev: [20.0, 35.0]
    enabled: true
  lhc13:
    label: "LHC Run 2"
    beam_type: pp
    beam_energy_gev: 6500.0
    full_pipeline: true
    detector_ids: [cms]
    default_detector_id: cms
    mass_window_gev: [50.0, 130.0]
    enabled: true
  lep91:
    label: "LEP-like Z-pole run"
    beam_type: ee
    beam_energy_gev: 45.6
    full_pipeline: true
    detector_ids: [aleph]
    default_detector_id: aleph
    mass_window_gev: [10.0, 130.0]
    enabled: true
  higgs240:
    label: "Future circular Higgs factory"
    beam_type: ee
    beam_energy_gev: 120.0
    full_pipeline: true
    detector_ids: [idea]
    default_detector_id: idea
    mass_window_gev: [10.0, 250.0]
    enabled: true

processes:
  ee_mumu_qed:
    label: "e+ e- → μ+ μ-"
    collider_ids: [markii29]
    model_ids: [qed_dilepton]
    madgraph_lines:
      # Beam 1 is e- (+z), matching the exercise's definition of theta.
      - generate e- e+ > mu- mu+ / z h
    full_pipeline: false
    enabled: true
  dy_ll:
    label: "p p → e+ e- or μ+ μ- (combined)"
    collider_ids: [lhc13]
    model_ids: [sm, loop_sm, blackbox_1]
    madgraph_lines:
      - generate p p > e+ e- QED=2 QCD=0
      - add process p p > mu+ mu- QED=2 QCD=0
    full_pipeline: true
    enabled: true
  dy_ee:
    label: "p p → e+ e-"
    collider_ids: [lhc13]
    model_ids: [sm, loop_sm, blackbox_1]
    madgraph_lines:
      - generate p p > e+ e- QED=2 QCD=0
    full_pipeline: true
    enabled: true
  dy_mumu:
    label: "p p → μ+ μ-"
    collider_ids: [lhc13]
    model_ids: [sm, loop_sm, blackbox_1]
    madgraph_lines:
      - generate p p > mu+ mu- QED=2 QCD=0
    full_pipeline: true
    enabled: true
  # Complete alternative predictions above retain photon–Z interference.
  # Photon-only nulls exclude Z/H exchange at the same coupling order.
  # Use the same collider, mass window, detector and channel for comparisons.
  dy_ee_photon:
    label: "p p → e+ e-"
    collider_ids: [lhc13]
    model_ids: [qed_dilepton]
    madgraph_lines:
      - generate p p > e+ e- / z h QED=2 QCD=0
    full_pipeline: true
    enabled: true
  dy_mumu_photon:
    label: "p p → μ+ μ-"
    collider_ids: [lhc13]
    model_ids: [qed_dilepton]
    madgraph_lines:
      - generate p p > mu+ mu- / z h QED=2 QCD=0
    full_pipeline: true
    enabled: true
  ee_mumu:
    label: "Lepton pair: e+ e- → μ+ μ-"
    collider_ids: [lep91, higgs240]
    model_ids: [sm, loop_sm, blackbox_1]
    madgraph_lines:
      - generate e+ e- > mu+ mu- QED=2 QCD=0
    full_pipeline: true
    enabled: true
  ee_zh_mumu:
    label: "Higgsstrahlung: e+ e- → ZH, Z → μ+ μ-"
    collider_ids: [higgs240]
    model_ids: [sm, loop_sm, blackbox_1]
    minimum_com_energy_gev: 220.0
    madgraph_lines:
      - generate e+ e- > z h, z > mu+ mu-
    full_pipeline: true
    enabled: true
  ee_ww_mumu:
    label: "W pair: e+ e- → W+W- → μ+ν μ-ν̄"
    collider_ids: [higgs240]
    model_ids: [sm, loop_sm, blackbox_1]
    minimum_com_energy_gev: 165.0
    madgraph_lines:
      - generate e+ e- > w+ w-, w+ > mu+ vm, w- > mu- vm~
    full_pipeline: true
    enabled: true
